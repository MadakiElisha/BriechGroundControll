name: DotNet Build
on:
  push:
    branches:
      - development
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    name: Build Release
    runs-on: windows-latest
    env:
      IS_DEV: ${{ github.ref == 'refs/heads/development' }}
      IS_MASTER: ${{ github.ref == 'refs/heads/master' }}
      MSI_NAME: BriechGroundControl.msi
      ZIP_NAME: BriechGroundControl.zip

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 10

      - name: Build
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          nuget locals all -clear
          msbuild -v:m -restore -t:Build -p:Configuration=Release MissionPlanner.sln

      - name: Unit tests
        shell: pwsh
        run: |
          # offline tests only: MAVLink sysid and MissionPlanner.ArduPilot.Tests (aliases, flight commands, firmware filter, engine).
          # BoardDetectTests are left out: 6 of them fail on stock upstream too (stale board tables).
          dotnet test MissionPlannerTests/MissionPlannerTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Sysid32Tests|FullyQualifiedName~MissionPlanner.ArduPilot.Tests" --logger "trx;LogFileName=unit.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Quadplane SITL smoke test
        # informational until it has proven stable: it depends on firmware.ardupilot.org being reachable
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          $sitl = Join-Path $env:RUNNER_TEMP "sitl"
          New-Item -ItemType Directory -Force -Path $sitl | Out-Null
          $base = "https://firmware.ardupilot.org/Tools/MissionPlanner/sitl/PlaneStable"
          Invoke-WebRequest "$base/ArduPlane.elf" -OutFile "$sitl\ArduPlane.exe"
          foreach ($dll in "cygatomic-1.dll","cyggcc_s-1.dll","cyggcc_s-seh-1.dll","cyggomp-1.dll","cygiconv-2.dll","cygintl-8.dll","cygquadmath-0.dll","cygssp-0.dll","cygstdc++-6.dll","cygwin1.dll") {
            try { Invoke-WebRequest "$base/$dll" -OutFile "$sitl\$dll" } catch { Write-Host "optional $dll not found" }
          }
          Invoke-WebRequest "https://raw.githubusercontent.com/ArduPilot/ardupilot/master/Tools/autotest/default_params/quadplane.parm" -OutFile "$sitl\quadplane.parm"
          # Briech helipad, 300 m AMSL, heading 0
          $p = Start-Process -FilePath "$sitl\ArduPlane.exe" -WorkingDirectory $sitl -PassThru -NoNewWindow `
               -ArgumentList "-Mquadplane","-O8.89331,7.26416,300,0","-s1","--serial0","tcp:0","--defaults","quadplane.parm"
          try {
            $env:BRIECH_SITL_TCP = "127.0.0.1:5760"
            dotnet test MissionPlannerTests/MissionPlannerTests.csproj --configuration Release --no-build --filter "TestCategory=SITL" --logger "trx;LogFileName=sitl.trx" --logger "console;verbosity=detailed"
            $code = $LASTEXITCODE
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          exit $code

      - name: Cleanup
        shell: pwsh
        run: |
          cd bin\Release\net461
          gci plugins | ForEach-Object { if (Test-Path $_.Name -PathType Leaf) { Write-Host "Remove" $_.FullName ; Remove-Item $_.FullName } else { Write-Host $_.Name } }
          copy version.txt ..\..\..\
          7z a -tzip ..\..\..\${{ env.ZIP_NAME }} *
          cd ..
          .\md5sum.exe net461 > ..\..\checksums.txt

      - name: Create MSI
        shell: pwsh
        run: |
          cd Msi
          if (Test-Path installer.wxs) { Remove-Item installer.wxs }
          & ".\net472\wix.exe" "..\bin\Release\net461"
          & "$env:WIX\bin\candle.exe" installer.wxs -ext WiXNetFxExtension -ext WixDifxAppExtension -ext WixUIExtension.dll -ext WixUtilExtension -ext WixIisExtension
          & "$env:WIX\bin\light.exe" installer.wixobj "$env:WIX\bin\difxapp_x86.wixlib" -sval -o ${{ env.MSI_NAME }} -ext WiXNetFxExtension -ext WixDifxAppExtension -ext WixUIExtension.dll -ext WixUtilExtension -ext WixIisExtension
          Move-Item ${{ env.MSI_NAME }} ..\${{ env.MSI_NAME }}

      # Branch and PR builds aren't released; keep their installer as a download so a PR can be tested before merging
      - name: Upload test installer
        if: ${{ env.IS_MASTER != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-installer-${{ github.ref_name == '' && 'branch' || github.run_number }}
          path: ${{ env.MSI_NAME }}
          retention-days: 14

      - name: Get version from version.txt
        id: version
        if: ${{ env.IS_MASTER == 'true' }}
        shell: pwsh
        run: |
          $version = Get-Content "version.txt" -Raw
          $version = $version.Trim()
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Found version: $version"

      - uses: "marvinpinto/action-automatic-releases@v1.2.1"
        if: ${{ env.IS_DEV == 'true' }}
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "development-build"
          prerelease: true
          title: "Briech Ground Control Development Build"
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.MSI_NAME }}
            checksums.txt
            version.txt
            ChangeLog.txt

      - uses: "marvinpinto/action-automatic-releases@v1.2.1"
        if: ${{ env.IS_MASTER == 'true' }}
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "BriechGroundControl-${{ steps.version.outputs.VERSION }}"
          prerelease: false
          title: "Briech Ground Control ${{ steps.version.outputs.VERSION }}"
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.MSI_NAME }}
            checksums.txt
            version.txt
            ChangeLog.txt

  buildDebug:
    name: Build Debug
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 10

      - name: Cache multiple paths
        uses: actions/cache@v4
        with:
          path: |
            **/obj/**
          key: ${{ runner.os }}-buildDebug

      - name: Build
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          nuget locals all -clear
          msbuild -v:m -restore -t:Build -p:Configuration=Debug MissionPlanner.sln

      - name: Cleanup
        shell: pwsh
        run: |
          cd bin\Debug\net461
          gci plugins | ForEach-Object { if (Test-Path $_.Name -PathType Leaf) { Write-Host "Remove" $_.FullName ; Remove-Item $_.FullName } else { Write-Host $_.Name } }
